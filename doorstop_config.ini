# UnityDoorstop configuration for the Timeflow ModLoader.
# This file must sit next to Timeflow.exe, alongside winhttp.dll.
# See https://github.com/NeighTools/UnityDoorstop for the full reference.

[General]

# Enable Doorstop.
enabled=true

# Assembly that Doorstop loads and executes first.
# It must contain `static void Doorstop.Entrypoint.Start()`.
target_assembly=TimeflowModLoader\Core\Timeflow.ModLoader.dll

# Redirect Unity's player log to <current folder>\output_log.txt (helpful when debugging).
redirect_output_log=true

boot_config_override=
ignore_disable_switch=false


# Options specific to the Unity Mono runtime (this game).
[UnityMono]

# Extra folders searched for assemblies before the game's Managed folder.
# Our loader directory is first so 0Harmony.dll and mod dependencies resolve.
dll_search_path_override=

debug_enabled=false
debug_address=127.0.0.1:10000
debug_suspend=false


# Unused for a Mono game.
[Il2Cpp]
coreclr_path=
corlib_dir=
